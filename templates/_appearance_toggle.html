<button
  type="button"
  class="icon-button appearance-toggle"
  data-transparency-toggle
  aria-label="Reduce transparency"
  aria-pressed="false"
  title="Reduce transparency"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3" y="3" width="14" height="14" rx="5" />
    <rect
      x="8"
      y="8"
      width="13"
      height="13"
      rx="5"
      fill="currentColor"
      fill-opacity=".18"
    />
  </svg>
</button>
<span
  id="appearance-status"
  class="sr-only"
  role="status"
  aria-live="polite"
></span>
